name: CI

# CI DIAGNOSIS BRANCH (ci/mtlgl-ios-ar), not for main: the AR template crashed on the iOS Simulator after the GL translation
# layers got glCopyImageSubData / glClearBufferfv (a42424d6): Metal command buffer timeout, then access revoked, then SIGABRT in
# -[CAMetalLayer nextDrawable]. This job builds only the iOS players and runs the AR game with one variant per launch.
# Second run: the first runner lost communication with the server (log cut during the build, files never uploaded); each variant now
# runs on a freshly booted simulator with time limits, results also go to annotations, and two alternative depth copies are tried
# (CQ_MTLGL_DEPTHCOPY=buffer / draw).
# Third run: the second one ran no variant (exit 127 everywhere: macOS has no GNU timeout); the script now uses a perl helper.
# Fourth run: the third one showed slow GPU frames (0.3-5 s) in every variant, also in frames without a copy / clear, and a stuck grep;
# now the old behaviour (copy / clears skipped, as before a42424d6) and the new one alternate three times each, plus runs without
# the 3D game, with the per-frame count of new pipelines / textures.
# Fifth run: the new behaviour against the same with only TAA's previous-depth copy skipped, four times each.
on:
  push:
    branches: ["ci/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS iOS Simulator AR diagnosis (MtlGL copy / clear)
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install ninja
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Build the 3D template and the AR template for the iOS Simulator
        timeout-minutes: 100
        run: |
          set +e
          for c in ios_simulator ios_simulator_ar; do
            CQ_TEST_IOS=1 CQ_IOS_BUILD_ROOT="$PWD/build-ios" python3 Tools/Tests/regression.py $c
            if [ $? -ne 0 ]; then
              cat ~/.cache/cq-build/regression/_Reg_$c.txt.result.txt
              grep -E "package_ios|error:|Error|FAILED|iOS" build/bin/Conqueror.log | tail -150
              exit 1
            fi
          done
      - name: Run the AR game once per variant on a freshly booted simulator (the 3D game runs beside it, as in the failed CI run)
        timeout-minutes: 130
        run: bash .github/diag_ar_variants.sh
      - name: Upload the diagnosis files
        if: always()
        timeout-minutes: 15
        uses: actions/upload-artifact@v4
        with:
          name: mtlgl-ios-ar-diagnosis
          path: |
            diag/*.txt
            diag/*.log
            diag/*.oslog
            diag/*.out
          if-no-files-found: ignore
